# Builds a release for every runtime identifier on a tag, then proves the Windows
# and macOS archives actually run on Windows and macOS. Alongside the archives it
# publishes Velopack's self-updating installers, which is what installed copies
# update from.
#
# That second part is the point. scripts/package.sh cross-publishes happily from
# Linux, which shows the files were produced - not that the binary starts once
# they are on the machine they were built for.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, win-arm64, osx-x64, osx-arm64]

    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with Directory.Build.props would publish a release
      # called one version full of files - and an updater - that say another.
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(scripts/version.sh)"
          if [[ "$tag" != "$version" ]]; then
            echo "tag v$tag does not match the version in Directory.Build.props, $version" >&2
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Package
        id: package
        run: echo "path=$(scripts/package.sh ${{ matrix.rid }})" >> "$GITHUB_OUTPUT"

      # Uploaded whole. upload-artifact drops the executable bit, so the runnable
      # files have to stay inside the .tar.gz or .zip rather than go up loose.
      - uses: actions/upload-artifact@v4
        with:
          name: yappynotes-${{ matrix.rid }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

          # These live only long enough for the smoke jobs to download them and
          # for the release job to publish them. After that the archives are on
          # the release itself.
          retention-days: 1

  # YappyNotes is a desktop app and a runner has no display, so the proof that it
  # runs is that it answers an argument and exits. That is what --version is for.
  smoke-linux:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yappynotes-linux-x64

      - name: Run the packaged app
        run: |
          set -euo pipefail
          tar -xzf yappynotes-*-linux-x64.tar.gz
          ./YappyNotes.App --version | tee out.txt
          grep -q '^YappyNotes [0-9]\+\.[0-9]\+\.[0-9]\+' out.txt

  smoke-macos:
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yappynotes-osx-arm64

      - name: Run the packaged app
        run: |
          set -euo pipefail
          tar -xzf yappynotes-*-osx-arm64.tar.gz
          chmod +x ./YappyNotes.App
          ./YappyNotes.App --version | tee out.txt
          grep -q '^YappyNotes [0-9]\+\.[0-9]\+\.[0-9]\+' out.txt

  smoke-windows:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yappynotes-win-x64

      # This was written the other way round first, and the first run corrected
      # it: the output arrives on Windows exactly as it does elsewhere, and it is
      # $LASTEXITCODE that does not - PowerShell leaves it unset for a
      # GUI-subsystem binary, which a WinExe is. So the output is what proves it
      # ran, and an exit code has to be fetched through Start-Process -PassThru.
      - name: Run the packaged app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Get-Item yappynotes-*-win-x64.zip).FullName
          Expand-Archive -Path $zip -DestinationPath .

          $printed = (& .\YappyNotes.App.exe --version | Out-String)
          Write-Host $printed
          if ($printed -notmatch 'YappyNotes \d+\.\d+\.\d+') {
            throw "--version did not print a version; it printed: $printed"
          }

          # An argument it does not know exits 2. A binary that could not start at
          # all would not manage to disagree with us.
          $unknown = Start-Process -FilePath .\YappyNotes.App.exe -ArgumentList '--verison' `
            -Wait -PassThru -NoNewWindow
          if ($unknown.ExitCode -ne 2) {
            throw "an unknown argument exited $($unknown.ExitCode), expected 2"
          }

  # The self-updating installers, through Velopack. vpk packs only for the OS it
  # runs on, so unlike the archives these cannot all be cross-built on Linux.
  # Each one carries releases.<rid>.json, which is how an installed copy finds its
  # next version on the GitHub release this workflow publishes - the channel is
  # the runtime identifier, so every file name is distinct and all six share one
  # release.
  installers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-latest,  smoke: true }
          - { rid: linux-arm64, os: ubuntu-latest,  smoke: false }
          - { rid: win-x64,     os: windows-latest, smoke: true }
          - { rid: win-arm64,   os: windows-latest, smoke: false }
          - { rid: osx-x64,     os: macos-latest,   smoke: false }
          - { rid: osx-arm64,   os: macos-latest,   smoke: true }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Bash on every runner, Git Bash on Windows, so there is one script.
      - name: Pack
        shell: bash
        run: scripts/package-installer.sh ${{ matrix.rid }}

      # The same proof the archives get - the thing a reader installs has to
      # start on its own OS - taken from Velopack's portable build, which is the
      # installed layout without running an installer on a runner. Only the
      # runtimes a runner can execute; the arm64 Linux and Windows builds and the
      # x64 macOS one are packed but cannot be run here.
      - name: Run the portable build (Linux)
        if: matrix.smoke && runner.os == 'Linux'
        shell: bash
        env:
          # A runner has no FUSE to mount an AppImage with.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          app="artifacts/installers/${{ matrix.rid }}/YappyNotes-${{ matrix.rid }}.AppImage"
          chmod +x "$app"
          "$app" --version | tee out.txt
          grep -q '^YappyNotes [0-9]\+\.[0-9]\+\.[0-9]\+' out.txt

      - name: Run the portable build (macOS)
        if: matrix.smoke && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir portable
          unzip -q "artifacts/installers/${{ matrix.rid }}/YappyNotes-${{ matrix.rid }}-Portable.zip" -d portable
          app="$(find portable -path '*Contents/MacOS/YappyNotes.App' -type f | head -1)"
          test -n "$app" || { echo "no YappyNotes.App inside the portable zip"; exit 1; }
          "$app" --version | tee out.txt
          grep -q '^YappyNotes [0-9]\+\.[0-9]\+\.[0-9]\+' out.txt

      # Output is the proof on Windows, for the reason smoke-windows gives.
      - name: Run the portable build (Windows)
        if: matrix.smoke && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path "artifacts/installers/${{ matrix.rid }}/YappyNotes-${{ matrix.rid }}-Portable.zip" -DestinationPath portable
          $app = Get-ChildItem -Path portable -Recurse -Filter YappyNotes.App.exe | Select-Object -First 1
          if (-not $app) { throw "no YappyNotes.App.exe inside the portable zip" }
          $printed = (& $app.FullName --version | Out-String)
          Write-Host $printed
          if ($printed -notmatch 'YappyNotes \d+\.\d+\.\d+') {
            throw "--version did not print a version; it printed: $printed"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.rid }}
          path: artifacts/installers/${{ matrix.rid }}/*
          if-no-files-found: error
          retention-days: 1

  release:
    # Only once every archive has been shown to run on its own OS, and every
    # installer has been packed.
    needs: [smoke-linux, smoke-macos, smoke-windows, installers]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # A tag with a suffix - v0.2.0-beta.1 - is a prerelease, so it does not
      # take the "latest" slot people land on. Decided from the tag rather than
      # by hand, because the flag defaults to false and nothing else would
      # contradict it.
      - name: Is this a prerelease?
        id: kind
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          prerelease: ${{ steps.kind.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
